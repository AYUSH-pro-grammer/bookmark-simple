
<!DOCTYPE html>
<html>
<head>
    <title>Boba Bash Bengaluru</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #BEDEFF;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: black;
            font-size: 40px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
        }

        .container img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            cursor: pointer;
        }

        .container img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Boba Bash Bengaluru</h1>

    <p>Welcome to Boba Bash! Explore your favourite websites with a single click.</p>

    <div class="container">

        <a href="https://google.com" target="_blank">
            <img src="https://i.pinimg.com/736x/0b/6e/7b/0b6e7bbd9713fb7be9d993bd6805a18a.jpg"
                 alt="Google">
        </a>

        <a href="https://youtube.com" target="_blank">
            <img src="https://i.pinimg.com/736x/f7/9f/01/f79f015d25876fd31d93aff0f650d9b6.jpg"
                 alt="YouTube">
        </a>

        <a href="https://mail.google.com" target="_blank">
            <img src="https://i.pinimg.com/736x/d4/9d/c7/d49dc78f374c269d66caa67dcffef168.jpg"
                 alt="Gmail">
        </a>

    </div>

</body>
</html>
